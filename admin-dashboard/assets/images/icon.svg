<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075b36"/>
      <stop offset="60%" stop-color="#087b43"/>
      <stop offset="100%" stop-color="#0ea25c"/>
    </linearGradient>
    <linearGradient id="ballShine" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edf7f1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#05331f" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle / Badge -->
  <rect width="512" height="512" rx="136" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="124" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6"/>

  <!-- Ball Base Circle -->
  <circle cx="256" cy="256" r="162" fill="url(#ballShine)" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="162" fill="none" stroke="#087b43" stroke-width="10"/>

  <!-- Soccer Ball Pentagons & Seams -->
  <!-- Center Pentagon -->
  <polygon points="256,204 294,232 280,277 232,277 218,232" fill="#087b43"/>

  <!-- Top Pentagon -->
  <polygon points="256,114 286,95 304,124 282,154 256,146" fill="#087b43"/>
  <polygon points="256,114 226,95 208,124 230,154 256,146" fill="#087b43"/>

  <!-- Top-Right Pentagon -->
  <polygon points="346,170 380,188 372,224 336,220 324,188" fill="#087b43"/>

  <!-- Bottom-Right Pentagon -->
  <polygon points="328,326 362,342 342,374 306,364 300,332" fill="#087b43"/>

  <!-- Bottom-Left Pentagon -->
  <polygon points="184,326 150,342 170,374 206,364 212,332" fill="#087b43"/>

  <!-- Top-Left Pentagon -->
  <polygon points="166,170 132,188 140,224 176,220 188,188" fill="#087b43"/>

  <!-- Seam Lines connecting to Center -->
  <!-- Center to Top -->
  <line x1="256" y1="204" x2="256" y2="146" stroke="#087b43" stroke-width="9" stroke-linecap="round"/>
  <!-- Center to Top-Right -->
  <line x1="294" y1="232" x2="336" y2="220" stroke="#087b43" stroke-width="9" stroke-linecap="round"/>
  <!-- Center to Bottom-Right -->
  <line x1="280" y1="277" x2="300" y2="332" stroke="#087b43" stroke-width="9" stroke-linecap="round"/>
  <!-- Center to Bottom-Left -->
  <line x1="232" y1="277" x2="212" y2="332" stroke="#087b43" stroke-width="9" stroke-linecap="round"/>
  <!-- Center to Top-Left -->
  <line x1="218" y1="232" x2="176" y2="220" stroke="#087b43" stroke-width="9" stroke-linecap="round"/>

  <!-- Outer Seams connecting Pentagons -->
  <line x1="282" y1="154" x2="324" y2="188" stroke="#087b43" stroke-width="9" stroke-linecap="round"/>
  <line x1="336" y1="220" x2="372" y2="224" stroke="#087b43" stroke-width="9" stroke-linecap="round"/>
  <line x1="336" y1="220" x2="328" y2="326" stroke="#087b43" stroke-width="9" stroke-linecap="round"/>
  <line x1="300" y1="332" x2="306" y2="364" stroke="#087b43" stroke-width="9" stroke-linecap="round"/>
  <line x1="280" y1="277" x2="232" y2="277" stroke="#087b43" stroke-width="9" stroke-linecap="round"/>
  <line x1="212" y1="332" x2="206" y2="364" stroke="#087b43" stroke-width="9" stroke-linecap="round"/>
  <line x1="176" y1="220" x2="184" y2="326" stroke="#087b43" stroke-width="9" stroke-linecap="round"/>
  <line x1="176" y1="220" x2="140" y2="224" stroke="#087b43" stroke-width="9" stroke-linecap="round"/>
  <line x1="230" y1="154" x2="188" y2="188" stroke="#087b43" stroke-width="9" stroke-linecap="round"/>
  <line x1="230" y1="154" x2="282" y2="154" stroke="#087b43" stroke-width="9" stroke-linecap="round"/>

  <!-- Ball Perimeter Edge Curves -->
  <path d="M 286,95 A 162 162 0 0 1 346,170" fill="none" stroke="#087b43" stroke-width="9"/>
  <path d="M 372,224 A 162 162 0 0 1 362,342" fill="none" stroke="#087b43" stroke-width="9"/>
  <path d="M 342,374 A 162 162 0 0 1 256,418" fill="none" stroke="#087b43" stroke-width="9"/>
  <path d="M 256,418 A 162 162 0 0 1 170,374" fill="none" stroke="#087b43" stroke-width="9"/>
  <path d="M 150,342 A 162 162 0 0 1 140,224" fill="none" stroke="#087b43" stroke-width="9"/>
  <path d="M 132,188 A 162 162 0 0 1 226,95" fill="none" stroke="#087b43" stroke-width="9"/>
</svg>
