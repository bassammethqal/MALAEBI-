    "/fields/{fieldId}/availability": {
      "get": {
        "summary": "Get availability and price slots for a field",
        "tags": [
          "Availability"
        ],
        "responses": {
          "200": {
            "description": "Availability slots",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "field_id": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "date": {
                      "type": "string",
                      "format": "date"
                    },
                    "timezone": {
                      "type": "string"
                    },
                    "slots": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/TimeSlot"
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid request"
          },
          "404": {
            "description": "Resource not found"
          },
          "429": {
            "description": "Rate limit exceeded"
          }
        },
        "parameters": [
          {
            "$ref": "#/components/parameters/Date"
          }
        ],
        "security": [],
        "description": "Slots are generated using field opening hours and pricing rules. Every slot is 60 minutes. This response is advisory; booking creation revalidates availability atomically."
      }
    },
    "/bookings": {
      "post": {
        "summary": "Create player booking",
        "tags": [
          "Bookings"
        ],
        "responses": {
          "201": {
            "description": "Booking created as held (instant) or pending (approval)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Booking"
                }
              }
            }
          },
          "409": {
            "description": "Slot unavailable or conflicting booking"
          },
          "401": {
            "description": "Unauthenticated"
          },
          "403": {
            "description": "Insufficient role or resource scope"
          },
          "400": {
            "description": "Invalid request"
          },
          "404": {
            "description": "Resource not found"
          },
          "429": {
            "description": "Rate limit exceeded"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateBooking"
              }
            }
          }
        },
        "description": "Requires OTP-verified phone. The server reads confirmation/deposit policy from field settings; clients cannot override it. Approval requests expire after 10 minutes; instant holds expire after 5 minutes.",
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 8,
              "maxLength": 128
            },
            "description": "Unique per logical operation; replays return the original result."
          }
        ]
      }
    },
