{
  "openapi": "3.1.0",
  "info": {
    "title": "MALAEBI API",
    "version": "1.0.0",
    "description": "REST API for MALAEBI football-pitch discovery, booking, venue operations and administration. MVP launch scope: Ma'rib City and nearby areas, Yemen. All timestamps are ISO-8601 with timezone; server stores UTC."
  },
  "servers": [
    {
      "url": "https://api.malaebi.example.com/api/v1",
      "description": "Production placeholder; replace with deployed API host"
    },
    {
      "url": "https://staging-api.malaebi.example.com/api/v1",
      "description": "Staging placeholder"
    }
  ],
  "tags": [
    {
      "name": "Auth",
      "description": "Phone OTP authentication"
    },
    {
      "name": "Public Discovery",
      "description": "Public venue and field discovery"
    },
    {
      "name": "Availability",
      "description": "Field availability and pricing"
    },
    {
      "name": "Bookings",
      "description": "Player booking lifecycle"
    },
    {
      "name": "Venue Operations",
      "description": "Owner and delegated staff operations"
    },
    {
      "name": "Payments",
      "description": "Payment initiation and provider callbacks"
    },
    {
      "name": "Reviews & Disputes",
      "description": "Post-booking feedback and dispute handling"
    },
    {
      "name": "Notifications",
      "description": "User notifications"
    },
    {
      "name": "Administration",
      "description": "Platform administration"
    }
  ],
  "security": [
    {
      "BearerAuth": []
    }
  ],
  "paths": {
    "/auth/otp/request": {
      "post": {
        "summary": "Request a one-time password",
        "tags": [
          "Auth"
        ],
        "responses": {
          "202": {
            "description": "OTP request accepted; do not disclose whether a phone is registered."
          },
          "429": {
            "description": "Rate limit exceeded"
          },
          "400": {
            "description": "Invalid request"
          },
          "404": {
            "description": "Resource not found"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/OtpRequest"
              }
            }
          }
        },
        "security": []
      }
    },
    "/auth/otp/verify": {
      "post": {
        "summary": "Verify OTP and issue tokens",
        "tags": [
          "Auth"
        ],
        "responses": {
          "200": {
            "description": "Authenticated",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TokenPair"
                }
              }
            }
          },
          "400": {
            "description": "Invalid request"
          },
          "404": {
            "description": "Resource not found"
          },
          "429": {
            "description": "Rate limit exceeded"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/OtpVerify"
              }
            }
          }
        },
        "security": []
      }
    },
    "/auth/refresh": {
      "post": {
        "summary": "Refresh access token",
        "tags": [
          "Auth"
        ],
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": true
                }
              }
            }
          },
          "400": {
            "description": "Invalid request"
          },
          "404": {
            "description": "Resource not found"
          },
          "429": {
            "description": "Rate limit exceeded"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "refresh_token"
                ],
                "properties": {
                  "refresh_token": {
                    "type": "string"
                  }
                }
              }
            }
          }
        },
        "security": []
      }
    },
    "/auth/logout": {
      "post": {
        "summary": "Revoke current refresh session",
        "tags": [
          "Auth"
        ],
        "responses": {
          "204": {
            "description": "Session revoked"
          },
          "401": {
            "description": "Unauthenticated"
          },
          "403": {
            "description": "Insufficient role or resource scope"
          },
          "400": {
            "description": "Invalid request"
          },
          "404": {
            "description": "Resource not found"
          },
          "429": {
            "description": "Rate limit exceeded"
          }
        }
      }
    },
