            "description": "Rate limit exceeded"
          }
        }
      }
    },
    "/venues": {
      "get": {
        "summary": "Browse public venues",
        "tags": [
          "Public Discovery"
        ],
        "responses": {
          "200": {
            "description": "Venue results",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/VenueSummary"
                      }
                    },
                    "meta": {
                      "$ref": "#/components/schemas/PageMeta"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid request"
          },
          "404": {
            "description": "Resource not found"
          },
          "429": {
            "description": "Rate limit exceeded"
          }
        },
        "parameters": [
          {
            "name": "area_id",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "q",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 100
            }
          },
          {
            "name": "min_price",
            "in": "query",
            "schema": {
              "type": "number",
              "minimum": 0
            }
          },
          {
            "name": "max_price",
            "in": "query",
            "schema": {
              "type": "number",
              "minimum": 0
            }
          },
          {
            "name": "available_on",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "date"
            }
          },
          {
            "name": "sort",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "recommended",
                "price_asc",
                "rating_desc"
              ]
            }
          },
          {
            "$ref": "#/components/parameters/Page"
          },
          {
            "$ref": "#/components/parameters/PageSize"
          }
        ],
        "security": []
      },
      "post": {
        "summary": "Create a venue owned by current user",
        "tags": [
          "Venue Operations"
        ],
        "responses": {
          "201": {
            "description": "Venue created; pending admin verification"
          },
          "401": {
            "description": "Unauthenticated"
          },
          "403": {
            "description": "Insufficient role or resource scope"
          },
          "400": {
            "description": "Invalid request"
          },
          "404": {
            "description": "Resource not found"
          },
          "429": {
            "description": "Rate limit exceeded"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/VenueCreate"
              }
            }
          }
        }
      }
    },
